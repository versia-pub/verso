# An example config.toml, with every setting. Settings that are commented out show their default.
# Unknown keys are errors, so a typo stops Verso from starting rather than being ignored.
#
# Any string can take its value from the environment or a file, such as a secret:
# "${env:NAME}" or "${file:/run/secrets/name}". Write "$${" for a literal "${".

# "development" allows the settings marked "development only", for running Verso locally.
# mode = "production"

# The instance's domain, without a port. Accounts and federation are tied to it, so it can't
# change later.
domain = "social.example"

# Exactly one of these: a PostgreSQL connection string, or the path of a SQLite file.
database = { postgres = "postgresql://verso:${env:PGPASSWORD}@localhost/verso" }
# database = { sqlite = "verso.db" }
# With PostgreSQL, also how many connections each process may have, how long to wait for one, and
# how long a query may run (0 for no limit), which migrations aren't held to:
# database = { postgres = "…", pool_size = 30, connect_timeout_seconds = 10,
#     statement_timeout_seconds = 60 }

[media]
# How many pixels an uploaded picture may have, in each frame, before it is scaled down: as
# many as 3840×2160 by default, as on Mastodon.
# max_pixels = 8294400
# How many bytes an uploaded file may have: 16 MiB by default, as Mastodon allows pictures.
# max_upload_bytes = 16777216
# How many hours an upload no status was given is kept before it is removed.
# unattached_hours = 24

# Where uploaded files are kept. Exactly one of these: the path of a directory, which Verso makes
# if it isn't there, or a bucket on a server that speaks S3, such as AWS, Garage or MinIO.
storage = { filesystem = "/var/lib/verso/media" }
# [media.storage.s3]
# endpoint = "https://s3.eu-west-1.amazonaws.com"
# region = "eu-west-1"
# bucket = "verso-media"
# What objects' names start with, to share the bucket with other data.
# prefix = "verso/media"
# access_key_id = "AKIAIOSFODNN7EXAMPLE"
# secret_access_key = "${file:/run/secrets/s3}"
# Where the bucket's files are public, such as a CDN in front of it, each at <public_url>/<key>,
# with the prefix in it if the CDN needs it. Without it, Verso serves them.
# public_url = "https://media.social.example"
# How long a request to the server may take, uploads included.
# timeout_seconds = 120

[http]
# port = 8080
# Where the instance is reached, if not at https://<domain>. Development only.
# origin = "http://localhost:8080"
# The reverse proxies in front of Verso, as addresses or CIDR ranges. Only these are believed
# about who the client is (the X-Forwarded-For header).
trusted_proxies = ["127.0.0.1", "::1"]

[http.rate_limit]
# How many requests each client may make in a window, per access token, or per IP address
# without one.
# limit = 300
# window_seconds = 300
# Where counts are kept: "memory", in each server, or "database", shared by several web nodes.
# store = "memory"

[auth]
# A login form that takes any username, with no password. Development only.
# dev_login = false
# How long a request to an issuer may take before the login is given up on.
# timeout_seconds = 15

# The OpenID Connect providers users log in with. Without any, nobody can log in.
[[auth.issuers]]
# Shown on the login page when there is more than one.
name = "Example ID"
# Accounts are linked to the issuer's URL, so changing it unlinks them all.
url = "https://id.social.example"
client_id = "verso"
client_secret = "${file:/run/secrets/oidc-client-secret}"
# The claim a new account's username comes from.
# username_claim = "preferred_username"
# Scopes to ask for besides openid and profile, such as "groups" for a groups claim.
scopes = ["groups"]
# Who gets an account on first login: "open", "closed", or anyone whose claim holds a value.
registration = { claim = "groups", contains = "social-users" }
# Roles given to whoever's claim holds a value, re-checked at every login.
roles = [{ claim = "groups", contains = "social-admins", role = "Admin" }]

[federation]
# Lets Verso reach other instances at internal addresses, such as on a local network.
# Development only.
# allow_internal_addresses = false
# Instances not to federate with, with their subdomains, besides the ones blocked with
# `verso admin domains block`.
# blocked_domains = []
# Answers blocked instances as if nothing were wrong, rather than telling them they're blocked.
# silent_blocks = false
# How many days an instance can go unreached before Verso stops sending it anything, until it
# hears from it again.
# unreachable_days = 7
# For how many hours a delivery to an instance is tried before it is given up on, at most 720.
# delivery_hours = 48

[federation.fetch_limit]
# How many fetches each process makes from one instance in a window, so that what others send
# can't make Verso flood one.
# limit = 600
# window_seconds = 300

[federation.rate_limit]
# How many requests each instance may send in a window, apart from clients' limit. Requests
# that aren't validly signed count against their client instead.
# limit = 3000
# window_seconds = 300

[instance]
# Without a name, the instance goes by its domain.
name = "Example Social"
description = "A small place to talk."
contact = { email = "admin@social.example", account = "admin" }
rules = [
    { text = "Be kind" },
    { text = "No spam", hint = "Advertising counts as spam." },
]

# Long texts, in plain text with a blank line between paragraphs, and the day they last changed.
[instance.privacy_policy]
text = "${file:/etc/verso/privacy.txt}"
updated = 2026-10-01

# [instance.extended_description]
# [instance.terms_of_service]

[limits]
# How long what users write may be, in characters.
# display_name = 60
# note = 10000
# fields = 16
# field_name = 255
# field_value = 255
# A status, with its content warning. Links count as 23, whatever their length.
# status = 10000
# How many files a status may have attached.
# attachments = 16
# How many accounts a status may mention. Mentions past them are left as text.
# mentions = 100
# A file's description, its alt text.
# media_description = 4000

[permissions]
# What everyone may do, before roles add more: logged-out visitors, and every user.
# anonymous = ["read:account", "read:account_follows", "read:note"]
# default = [
#     "read:account",
#     "read:account_follows",
#     "read:note",
#     "owner:account",
#     "owner:follow",
#     "owner:media",
#     "owner:note",
# ]

[jobs]
# How many days a job that failed for good is kept, for someone to look at.
# dead_letter_days = 30

[logging]
# level = "info"
