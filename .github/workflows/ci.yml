name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

# A new push to a pull request makes its older runs pointless.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
              with:
                  extra_nix_config: system-features = nixos-test benchmark big-parallel kvm

            - name: Report KVM
              run: ls -l /dev/kvm || echo "No /dev/kvm, so NixOS VM tests will be slow or fail"

            # Restores the newest /nix snapshot, so checks whose inputs didn't change are skipped
            # instead of rebuilt. A new snapshot is saved whenever the Nix-relevant files change.
            - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
              with:
                  primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'deno.lock', 'deno.json', '**/*.nix', 'app/**') }}
                  restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
                  gc-max-store-size-linux: 5G

            - run: nix flake check -L
